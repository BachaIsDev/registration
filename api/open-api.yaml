openapi: 3.0.3
info:
  title: OpenApi Registration
  description: OpenApi registration specification
  version: 1.0.0
servers:
  - url: http://localhost:8080

paths:
  /api/v1/users:
    post:
      tags:
        - User
      operationId: signUp
      description: Создание пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/components/schemas/UserDto"
      responses:
        202:
          description: Запись создана
        400:
          description: Валидация не пройдена
          content:
            application/json:
              schema:
                $ref: "./components.yaml#/components/schemas/ErrorResponse"