components:
  schemas:
    UserDto:
      type: object
      properties:
        firstName:
          type: string
          nullable: false
          description: Имя
        lastName:
          type: string
          nullable: false
          description: Фамилия
        email:
          type: string
          nullable: false
          description: Почтовый адрес
        password:
          type: string
          nullable: false
          description: Пароль

    UserCredentialsDto:
      type: object
      properties:
        email:
          type: string
          nullable: false
          description: Почтовый адрес
        password:
          type: string
          nullable: false
          description: Пароль

    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          nullable: false
          description: Токен обновления

    JwtAuthenticationDto:
      type: object
      properties:
        token:
          type: string
          nullable: false
          description: JWT токен
        refreshToken:
          type: string
          nullable: false
          description: Токен обновления

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          nullable: false
          description: Код ошибки
        message:
          type: string
          description: Сообщение об ошибке